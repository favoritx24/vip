<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Система идентификации доступа</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --bg: #030712;
            --card-bg: rgba(17, 24, 39, 0.8);
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
            --accent-color: #60a5fa;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            background-image: 
                radial-gradient(circle at 0% 0%, rgba(59, 130, 246, 0.15) 0, transparent 40%),
                radial-gradient(circle at 100% 100%, rgba(59, 130, 246, 0.1) 0, transparent 40%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--text-main);
            overflow: hidden;
        }

        .container {
            width: 90%;
            max-width: 420px;
            perspective: 1000px;
        }

        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 28px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            position: relative;
            overflow: hidden;
            animation: cardEntry 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        @keyframes cardEntry {
            from { opacity: 0; transform: translateY(30px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .scan-line {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--primary), transparent);
            animation: scan 4s linear infinite;
            opacity: 0.4;
        }

        @keyframes scan {
            0% { top: -10%; }
            100% { top: 110%; }
        }

        .icon-wrapper {
            margin-bottom: 24px;
            display: inline-block;
            position: relative;
        }

        .shield-icon {
            width: 72px;
            height: 72px;
            fill: var(--primary);
            filter: drop-shadow(0 0 12px rgba(59, 130, 246, 0.4));
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .session-badge {
            display: inline-flex;
            align-items: center;
            background: rgba(59, 130, 246, 0.1);
            border: 1px solid rgba(59, 130, 246, 0.2);
            padding: 6px 14px;
            border-radius: 100px;
            margin-bottom: 20px;
        }

        .session-badge .dot {
            width: 6px;
            height: 6px;
            background: #10b981;
            border-radius: 50%;
            margin-right: 8px;
            box-shadow: 0 0 8px #10b981;
            animation: blink 1.5s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .session-id {
            font-size: 12px;
            font-weight: 700;
            color: var(--accent-color);
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            margin: 0 0 12px;
            letter-spacing: -0.5px;
            background: linear-gradient(to bottom, #fff, #9ca3af);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            font-size: 15px;
            color: var(--text-muted);
            line-height: 1.6;
            margin: 0 0 32px;
        }

        .btn {
            display: block;
            background: var(--primary);
            color: #ffffff;
            text-decoration: none;
            padding: 18px 24px;
            border-radius: 16px;
            font-weight: 600;
            font-size: 16px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 8px 20px rgba(59, 130, 246, 0.3);
            position: relative;
            overflow: hidden;
            border: none;
            cursor: pointer;
            width: 100%;
            outline: none;
            animation: pulseButton 2.5s infinite;
        }

        @keyframes pulseButton {
            0% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.4); }
            70% { box-shadow: 0 0 0 15px rgba(59, 130, 246, 0); }
            100% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); }
        }

        .btn:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(59, 130, 246, 0.4);
        }

        .footer-info {
            margin-top: 32px;
            padding-top: 24px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .info-item {
            font-size: 10px;
            color: #4b5563;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="glass-card">
            <div class="scan-line"></div>
            
            <div class="icon-wrapper">
                <svg class="shield-icon" viewBox="0 0 24 24">
                    <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm-2 16l-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9l-8 8z"/>
                </svg>
            </div>

            <div class="session-badge">
                <div class="dot"></div>
                <span class="session-id" id="session-id">LOADING...</span>
            </div>

            <h1>Индивидуальный доступ</h1>
            <p>Ваш персональный шлюз успешно идентифицирован. Система подготовила уникальное предложение для вашего профиля.</p>

            <a href="#" id="main-link" class="btn">АКТИВИРОВАТЬ ПРЕДЛОЖЕНИЕ</a>

            <div class="footer-info">
                <span class="info-item">End-to-end Encrypted</span>
                <span class="info-item">Verified Access</span>
            </div>
        </div>
    </div>

    <script>
        // Логика генерации ссылки
        window.onload = function() {
            // 1. Твоя ссылка
            var baseUrl = "https://wb247.liveblog365.com/vip/";
            
            // 2. Генерация ID
            var randomId = "VIP-" + Math.floor(100000 + Math.random() * 900000);
            
            // 3. Обновление текста на странице
            document.getElementById('session-id').innerText = "SESSION: " + randomId;
            
            // 4. Установка финальной ссылки в кнопку
            var finalUrl = baseUrl + "?utm_source=" + randomId;
            document.getElementById('main-link').href = finalUrl;
        };
    </script>

</body>
</html>
