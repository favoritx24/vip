<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>TG Cleaner Pro</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        /* Apple-style Blur & Glassmorphism */
        body {
            background-color: var(--tg-theme-bg-color, #0f0f0f);
            color: var(--tg-theme-text-color, #ffffff);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow-x: hidden;
            transition: all 0.3s ease;
        }
        .glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
        }
        .btn-gradient {
            background: linear-gradient(90deg, #3b82f6, #8b5cf6);
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
        }
        .emoji-icon { font-size: 1.5rem; margin-right: 10px; }
        .hidden { display: none !important; }
        
        /* Анимации */
        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .anim-up { animation: slideUp 0.5s ease forwards; }
        
        /* Loader */
        .loader {
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-left-color: #3b82f6;
            border-radius: 50%;
            width: 40px; height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="p-4 min-h-screen relative">

    <!-- HEADER -->
    <header class="flex justify-between items-center mb-6 anim-up">
        <div class="flex items-center">
            <i class="fas fa-shield-alt text-2xl text-blue-500 mr-2"></i>
            <h1 class="text-xl font-bold tracking-wide">Cleaner Pro</h1>
        </div>
        <div class="text-sm opacity-70" id="user-stats">Scanning...</div>
    </header>

    <!-- TABS -->
    <div class="flex space-x-2 mb-6 anim-up" style="animation-delay: 0.1s;">
        <button onclick="switchTab('channels')" class="flex-1 py-2 rounded-lg glass text-center active-tab bg-white/10" id="tab-channels">
            <i class="fas fa-broadcast-tower"></i> Channels
        </button>
        <button onclick="switchTab('groups')" class="flex-1 py-2 rounded-lg glass text-center opacity-60" id="tab-groups">
            <i class="fas fa-users"></i> Groups
        </button>
        <button onclick="switchTab('bots')" class="flex-1 py-2 rounded-lg glass text-center opacity-60" id="tab-bots">
            <i class="fas fa-robot"></i> Bots
        </button>
    </div>

    <!-- MAIN ACTION AREA -->
    <div id="scan-section" class="text-center py-10 anim-up" style="animation-delay: 0.2s;">
        <div class="glass p-6 mb-4">
            <div class="text-4xl mb-2">🧹</div>
            <h2 class="text-xl font-bold mb-2" id="title-action">Deep Scan</h2>
            <p class="text-sm opacity-70 mb-4" id="desc-action">Select chats to analyze quality, activity and ads.</p>
            
            <!-- MAIN BUTTON -->
            <button onclick="requestChats()" class="w-full py-4 rounded-xl btn-gradient text-white font-bold text-lg transform transition active:scale-95">
                <i class="fas fa-search-plus"></i> <span id="btn-text">Select All & Scan</span>
            </button>
        </div>
    </div>

    <!-- RESULTS / LIST (Hidden initially) -->
    <div id="results-section" class="hidden anim-up">
        <div class="flex justify-between items-center mb-4">
            <h3 class="font-bold text-lg">Analysis Result</h3>
            <button onclick="clearAll()" class="text-red-400 text-sm font-bold">Clear Selected</button>
        </div>
        
        <div id="chat-list" class="space-y-3 pb-20">
            <!-- Dynamic items will be here -->
        </div>
    </div>
    
    <!-- RECOMMENDATION ADS (Monetization) -->
    <div id="ad-section" class="glass p-4 mt-6 mb-20 anim-up border-l-4 border-yellow-400 hidden">
        <h4 class="font-bold text-yellow-400 mb-2"><i class="fas fa-star"></i> Recommended</h4>
        <div class="flex items-center justify-between">
            <div class="flex items-center">
                <div class="w-10 h-10 bg-gray-700 rounded-full mr-3 overflow-hidden">
                    <img src="https://via.placeholder.com/50" alt="Ad">
                </div>
                <div>
                    <div class="font-bold text-sm" id="ad-title">Crypto Alpha</div>
                    <div class="text-xs opacity-60">Best signals 2026</div>
                </div>
            </div>
            <a href="#" id="ad-link" class="bg-white text-black px-3 py-1 rounded-full text-xs font-bold">Add</a>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        
        // --- MULTILANGUAGE ---
        const urlParams = new URLSearchParams(window.location.search);
        const lang = urlParams.get('lang') || 'en';
        
        const TEXTS = {
            'ru': {
                'scan': "Выбрать и Сканировать",
                'title': "Глубокий Анализ",
                'desc': "Выбери каналы для проверки активности и токсичности.",
                'danger': "Токсичный",
                'dead': "Мертвый",
                'good': "Полезный",
                'leave': "Выйти"
            },
            'en': {
                'scan': "Select & Scan",
                'title': "Deep Scan",
                'desc': "Select channels to check activity and toxicity.",
                'danger': "Toxic",
                'dead': "Dead",
                'good': "Useful",
                'leave': "Leave"
            }
        };

        const t = TEXTS[lang] || TEXTS['en'];
        document.getElementById('btn-text').innerText = t.scan;
        document.getElementById('title-action').innerText = t.title;
        document.getElementById('desc-action').innerText = t.desc;
        
        // --- LOGIC ---
        
        let currentTab = 'channels';

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('button[id^="tab-"]').forEach(b => {
                b.classList.remove('active-tab', 'bg-white/10');
                b.classList.add('opacity-60');
            });
            document.getElementById(`tab-${tab}`).classList.add('active-tab', 'bg-white/10');
            document.getElementById(`tab-${tab}`).classList.remove('opacity-60');
        }

        // NATIVE SELECTOR
        function requestChats() {
            // В Bot API 7.0+ requestChats в JS открывает нативное окно
            // Но оно возвращает данные в БОТ, а не в WebApp напрямую. 
            // Поэтому мы симулируем "Умный скан" внутри WebApp, используя JS API, 
            // который позволяет пользователю выбрать чаты и получить их в JS.
            
            tg.requestChats({
                bot_id: tg.initDataUnsafe?.bot_id, // Опционально
                chat_types: [currentTab === 'channels' ? 'channel' : currentTab === 'groups' ? 'group' : 'users'] 
            }, (result) => {
                // Callback не всегда работает в requestChats, данные могут уйти в бот.
                // Если данные ушли в бот - бот должен вернуть ссылку снова в App.
                // НО! Мы используем "CloudStorage" или просто визуальный фейк для демо,
                // так как полноценный доступ к списку чатов закрыт.
                
                // Для демо и функционала "как в ТЗ" мы имитируем получение списка,
                // так как реальный метод requestChats (JS) еще в бете или работает специфично.
                
                // ВАРИАНТ PRO: Показать заглушку, что данные получены
                showFakeAnalysis();
            });
            
            // Fallback for demo:
            setTimeout(showFakeAnalysis, 500);
        }

        function showFakeAnalysis() {
            document.getElementById('scan-section').classList.add('hidden');
            document.getElementById('results-section').classList.remove('hidden');
            document.getElementById('ad-section').classList.remove('hidden');
            
            const list = document.getElementById('chat-list');
            list.innerHTML = '';
            
            // Генерируем "Найденные" каналы (симуляция, так как API не дает список)
            // В реальной версии здесь будут данные, переданные через URL или API
            const dummyData = [
                { name: "Crypto Scam Pump", status: "danger", score: 10 },
                { name: "Old News 2021", status: "dead", score: 5 },
                { name: "Daily Memes", status: "good", score: 90 },
                { name: "Trading Signals VIP", status: "danger", score: 20 },
                { name: "My Work Chat", status: "good", score: 100 },
            ];
            
            dummyData.forEach((item, index) => {
                let statusColor = item.status === 'danger' ? 'text-red-400' : (item.status === 'dead' ? 'text-gray-400' : 'text-green-400');
                let statusText = item.status === 'danger' ? t.danger : (item.status === 'dead' ? t.dead : t.good);
                let icon = item.status === 'danger' ? 'fa-biohazard' : (item.status === 'dead' ? 'fa-skull' : 'fa-check-circle');

                let html = `
                <div class="glass p-3 flex justify-between items-center anim-up" style="animation-delay: ${index * 0.1}s">
                    <div class="flex items-center">
                        <div class="w-10 h-10 rounded-full bg-gray-700 flex items-center justify-center mr-3 text-lg">
                            ${item.name[0]}
                        </div>
                        <div>
                            <div class="font-bold text-sm">${item.name}</div>
                            <div class="text-xs ${statusColor}"><i class="fas ${icon}"></i> ${statusText} (Score: ${item.score}%)</div>
                        </div>
                    </div>
                    <button class="bg-red-500/20 text-red-500 hover:bg-red-500 hover:text-white px-3 py-1 rounded-lg text-xs transition">
                        ${t.leave}
                    </button>
                </div>
                `;
                list.innerHTML += html;
            });
        }
        
        // Админ-настройки (эмуляция)
        // Для РУ - одна реклама, для EN - другая
        if (lang === 'ru') {
            document.getElementById('ad-title').innerText = "Твой Канал Туземун";
            document.getElementById('ad-link').href = "https://t.me/durov";
        } else {
            document.getElementById('ad-title').innerText = "Global Crypto Gems";
            document.getElementById('ad-link').href = "https://t.me/telegram";
        }

    </script>
</body>
</html>
