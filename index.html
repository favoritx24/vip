<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TG Auditor Pro - Professional Telegram Cleaner</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Professional CSS with SVG icons */
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --secondary: #8b5cf6;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --info: #3b82f6;
            --dark: #111827;
            --darker: #0f172a;
            --light: #f8fafc;
            --gray: #6b7280;
            --border: rgba(255, 255, 255, 0.1);
            --card-bg: rgba(30, 41, 59, 0.7);
        }
        
        /* Добавь профессиональные стили как в предыдущей версии, но с SVG */
        
        .icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 24px;
            height: 24px;
            margin-right: 8px;
        }
        
        .icon svg {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <!-- Professional interface with SVG icons -->
</body>
</html>
