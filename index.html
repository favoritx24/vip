<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TG Auditor - Clean Your Telegram</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: white;
        }
        
        .container {
            max-width: 500px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
        }
        
        .logo {
            font-size: 3em;
            margin-bottom: 10px;
        }
        
        h1 {
            font-size: 28px;
            margin-bottom: 10px;
            background: linear-gradient(to right, #fff, #a5b4fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .subtitle {
            opacity: 0.8;
            margin-bottom: 30px;
        }
        
        .card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .btn {
            display: block;
            width: 100%;
            padding: 18px;
            background: linear-gradient(to right, #4f46e5, #7c3aed);
            color: white;
            border: none;
            border-radius: 15px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            margin: 15px 0;
            transition: all 0.3s;
            text-align: center;
            text-decoration: none;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(79, 70, 229, 0.3);
        }
        
        .btn-secondary {
            background: rgba(255, 255, 255, 0.15);
        }
        
        .result-item {
            background: rgba(255, 255, 255, 0.08);
            padding: 15px;
            border-radius: 12px;
            margin: 10px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .badge {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }
        
        .badge-dead {
            background: #ef4444;
        }
        
        .badge-spam {
            background: #f59e0b;
        }
        
        .badge-good {
            background: #10b981;
        }
        
        .loading {
            text-align: center;
            padding: 30px;
        }
        
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">🧹</div>
            <h1>TG Auditor Pro</h1>
            <p class="subtitle">Clean your Telegram in 1 click</p>
        </div>
        
        <div class="card">
            <h2>📊 Select Channels</h2>
            <p>Choose which channels to analyze</p>
            
            <button class="btn" onclick="requestChannels()" id="selectBtn">
                🗂 Select Channels
            </button>
            
            <div id="selectedCount" class="hidden">
                Selected: <span id="count">0</span> channels
            </div>
        </div>
        
        <div class="card hidden" id="analysisCard">
            <h2>🔍 Analysis Results</h2>
            <div id="results"></div>
            
            <button class="btn" onclick="showCleanup()">
                🗑️ Delete Selected
            </button>
        </div>
        
        <div class="card" id="recommendations">
            <h2>💎 Recommended Channels</h2>
            <div id="channelsList">
                <p>Loading recommendations...</p>
            </div>
        </div>
        
        <div class="card">
            <h2>📈 Your Stats</h2>
            <div id="stats">
                <p>Analyze channels to see statistics</p>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
